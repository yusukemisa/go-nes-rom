# NROM-128: 16KB PRG at $C000-$FFFF (mirrored at $8000), 8KB CHR.
# Matches go-nes-by-pstack testdata/nestest.nes: mapper 0, one PRG page, one CHR page.
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    ROM:    start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    CODE:    load = ROM,    type = ro, start = $C000;
    VECTORS: load = ROM,    type = ro, start = $FFFA;
    CHARS:   load = CHR,    type = ro;
}
